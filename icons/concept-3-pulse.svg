<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg3" cx="0.5" cy="0.42" r="0.85">
      <stop offset="0" stop-color="#13C485"/>
      <stop offset="0.6" stop-color="#067A4D"/>
      <stop offset="1" stop-color="#02321F"/>
    </radialGradient>
    <linearGradient id="gloss3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo3" cx="0.5" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="240" ry="240" fill="url(#bg3)"/>
  <rect width="1024" height="1024" rx="240" ry="240" fill="url(#halo3)"/>
  <rect width="1024" height="1024" rx="240" ry="240" fill="url(#gloss3)"/>

  <!-- 3 bars centered: short / tall / short. Heights 320 / 540 / 320, width 96, gap 56. -->
  <g fill="#ffffff" filter="url(#glow3)">
    <rect x="312" y="352" width="96" height="320" rx="48"/>
    <rect x="464" y="242" width="96" height="540" rx="48"/>
    <rect x="616" y="352" width="96" height="320" rx="48"/>
  </g>
</svg>
