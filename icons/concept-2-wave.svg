<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EE9B5"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gloss2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="240" ry="240" fill="url(#bg2)"/>
  <rect width="1024" height="1024" rx="240" ry="240" fill="url(#gloss2)"/>

  <!-- 5 bars in symmetric wave: 220 / 400 / 580 / 400 / 220, width 76, gap 28, centered -->
  <g filter="url(#shadow2)" fill="#ffffff">
    <rect x="262" y="402" width="76" height="220" rx="38"/>
    <rect x="366" y="312" width="76" height="400" rx="38"/>
    <rect x="470" y="222" width="76" height="580" rx="38"/>
    <rect x="574" y="312" width="76" height="400" rx="38"/>
    <rect x="678" y="402" width="76" height="220" rx="38"/>
  </g>
</svg>
