<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10D87B"/>
      <stop offset="1" stop-color="#006B3C"/>
    </linearGradient>
    <linearGradient id="gloss1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#E8FFF3"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Squircle silhouette (macOS-style) -->
  <rect width="1024" height="1024" rx="240" ry="240" fill="url(#bg1)"/>
  <rect width="1024" height="1024" rx="240" ry="240" fill="url(#gloss1)"/>

  <!-- Equalizer bars: heights 360 / 580 / 460 / 280, width 84, gap 30, centered -->
  <g filter="url(#shadow1)">
    <rect x="316" y="332" width="84" height="360" rx="42" fill="url(#bar1)"/>
    <rect x="430" y="222" width="84" height="580" rx="42" fill="url(#bar1)"/>
    <rect x="544" y="282" width="84" height="460" rx="42" fill="url(#bar1)"/>
    <rect x="658" y="372" width="84" height="280" rx="42" fill="url(#bar1)"/>
  </g>
</svg>
